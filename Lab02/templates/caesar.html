<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Caesar Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center">CAESAR CIPHER</h2>

        <!-- ENCRYPTION SECTION -->
        <div class="mt-4">
            <h5 style="color: blue;">ENCRYPTION</h5>
            <form id="encryptForm">
                <div class="mb-3">
                    <label class="form-label">Plain text:</label>
                    <input type="text" class="form-control" name="inputPlainText" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Key:</label>
                    <input type="number" class="form-control" name="inputKeyPlain" required>
                </div>
                <button type="submit" class="btn btn-primary">Encrypt</button>
            </form>
            <div id="encryptResult" class="mt-3 text-success font-weight-bold"></div>
        </div>

        <!-- DECRYPTION SECTION -->
        <div class="mt-5">
            <h5 style="color: blue;">DECRYPTION</h5>
            <form id="decryptForm">
                <div class="mb-3">
                    <label class="form-label">Cipher text:</label>
                    <input type="text" class="form-control" name="inputCipherText" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Key:</label>
                    <input type="number" class="form-control" name="inputKeyCipher" required>
                </div>
                <button type="submit" class="btn btn-success">Decrypt</button>
            </form>
            <div id="decryptResult" class="mt-3 text-success font-weight-bold"></div>
        </div>
    </div>

    <script>
        document.getElementById('encryptForm').addEventListener('submit', function (e) {
            e.preventDefault(); // Ngăn chuyển trang
            const formData = new FormData(this);
            fetch('/encrypt', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(data => {
                document.getElementById('encryptResult').innerHTML = data;
            })
            .catch(error => {
                document.getElementById('encryptResult').innerHTML = "Lỗi khi mã hóa!";
                console.error(error);
            });
        });

        document.getElementById('decryptForm').addEventListener('submit', function (e) {
            e.preventDefault(); // Ngăn chuyển trang
            const formData = new FormData(this);
            fetch('/decrypt', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(data => {
                document.getElementById('decryptResult').innerHTML = data;
            })
            .catch(error => {
                document.getElementById('decryptResult').innerHTML = "Lỗi khi giải mã!";
                console.error(error);
            });
        });
    </script>
</body>
</html>
